<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DT211G - Recipe Roulette</title>
    <link rel="stylesheet" href="/src/css/style.scss">
    <script src="/src/js/main.js" type="module" defer></script>
  </head>
  <body>
    <header>
      <div class="container">
          <nav>
            <div class="logo"><a href="/">BästKatt</a></div>
            
            <button class="burger">&#x2630;</button>

            <ul class="menu">
              <li><a href="/">Hem</a></li>
              <li id="dark-toggle">🌙</li>
            </ul>

          </nav>
      </div>
    </header>

    <main class="container">
      <h1>Välj bäst katt!</h1>
      <p>Lab 3 går ut på att använda SCSS för att ge stil åt en webbplats.</p>
      <p>Jag har valt att göra en enkel rankingsajt där användare kan rösta på bäst katt.</p>
      <p>Det finns bara några få bilder att rösta på, och resultaten sparas bara per session.</p>

      <hr>

      <div id="votingArea">

        <h2>Rösta här</h2>

        <div class="image-container">
          <img id="img1" class="vote-image" />
          <img id="img2" class="vote-image" />
        </div>

        <div class="controls">
          <button id="voteBtn" class="btn-primary" disabled>Rösta</button>
          <button id="resultsBtn" class="btn-primary">Visa Resultat</button>
        </div>

      </div>

    </main>
  </body>
</html>
