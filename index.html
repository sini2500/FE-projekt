<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DT211G - Recipe Roulette</title>

    <link rel="stylesheet" href="/src/css/style.scss" />
    <script type="module" src="/src/js/main.js" defer></script>
    <script type="module" src="/src/js/karta.js" defer></script>

  </head>

  <body>
    <header>
      <div class="container">
          <nav>
            <div class="logo"><a href="/">Recipe Roulette</a></div>
            
            <button class="burger">&#x2630;</button>

            <ul class="menu">
              <li><a href="/">Home</a></li>
              <li><a href="/">Random Recipe</a></li>
              <li id="dark-toggle">🌙</li>
            </ul>

          </nav>
      </div>
    </header>

    <main class="container">

      <section class="controls">
        <div id="wheel" class="wheel">?</div>
        <button id="random-btn" class="btn-primary">
          Spin the wheel
        </button>
      </section>

      <section class="grid">

        <article id="recipe" class="card">
          <p>Hit the button to get a random recipe</p>
        </article>

        <article class="card map-card">
          <div id="map"></div>
        </article>

        <article id="trivia" class="card">
          <p>Country trivia goes here</p>
        </article>

      </section>

    </main>

    <footer>
      <div class="container">
        <p>Recipe Roulette - random recipes and trivia</p>
      </div>
    </footer>

  </body>
</html>
