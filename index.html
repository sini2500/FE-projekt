<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DT211G - Recipe Roulette</title>

    <link rel="stylesheet" href="/src/css/style.scss" />
    <script type="module" src="/src/js/main.js" defer></script>

  </head>

  <body>
    <header>
      <div class="container">
          <nav>
            <div class="logo"><a href="/">Recipe Roulette</a></div>
            
            <button class="burger">&#x2630;</button>

            <ul class="menu">
              <li><a href="/">Random Recipe</a></li>
              <li id="dark-toggle">🌙</li>
            </ul>

          </nav>
      </div>
    </header>

    <main class="container">

      <div class="layout">

        <div class="flex-col">


          <div class="gridRow">

            <div class="imageBox" id="recipe-image">
            </div>

            <div class="titleBox" id="recipe-header">
              <h2>Get a recipe</h2>
              <p>Spin the wheel to get a random recipe</p>
            </div>

          </div>

          <div class="gridRow">

            <div class="ingredientsBox" id="recipe-ingredients">
              <h3>Ingredients</h3>
            </div>

            <div class="instructionsBox" id="recipe-instructions">
              <h3>Instructions</h3>
            </div>

          </div>

        </div>

        <div class="flex-col">

          <div class="actionBox">
            <div id="wheel" class="wheel"></div>

            <button id="random-btn" class="btn">New Recipe</button>
          </div>

          <div class="countryBox" id="trivia">
            <p>Country info goes here</p>
          </div>

          <div class="mapBox">
            <iframe id="map" width="100%" height="350" frameborder="0" scrolling="no" src="https://www.openstreetmap.org/export/embed.html?layer=mapnik"></iframe>
          </div>

        </div>

      </div>

    </main>

    <footer>
      <div class="container">
        <p>Recipe Roulette - random recipes and trivia</p>
      </div>
    </footer>

  </body>
</html>
